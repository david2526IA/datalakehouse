[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datalakehouse"
version = "0.1.0"
description = "A reproducible local lakehouse pipeline for operational analytics."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David Falcon"}]
dependencies = ["duckdb>=1.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
datalakehouse = "datalakehouse.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
